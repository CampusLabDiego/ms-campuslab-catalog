spring.application.name=ms-campuslab-catalog

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

# Validacion de tokens Microsoft Entra ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/7d5727ec-99c0-4161-9e1a-194c51532c5b/v2.0
campuslab.security.audience=3bdd9813-1e51-4686-a89a-760ac0531de9

# Conexion a los dos nodos RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:172.31.45.233:5672,172.31.45.233:5673}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:campuslab}

spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# Confirmaciones del broker y mensajes sin destino
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumidores con confirmacion manual
spring.rabbitmq.listener.type=simple
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=5
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2

# Evita reencolar indefinidamente los mensajes rechazados
spring.rabbitmq.listener.simple.default-requeue-rejected=false